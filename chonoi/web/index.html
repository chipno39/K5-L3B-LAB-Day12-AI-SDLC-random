<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1410; color: #f3e9d8; font: 14px/1.4 system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp của nhóm. CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Không tính luật: mọi con số hiển thị lấy từ snapshot / meta / menu. Trường chưa có thì bỏ qua.
 * Hiệu ứng (sóng, bong bóng, khói, đèn dây) chỉ dùng đồng hồ trình duyệt, KHÔNG đi vào sim nên headless không đổi.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;
// ---- Chế độ Tương phản cao (phím H): chỉ là lớp hiển thị, lưu trong trình duyệt, không đi vào sim
let HC = false;
try { HC = localStorage.getItem("chonoi_hc") === "1"; } catch (e) { /* trình duyệt chặn lưu: bỏ qua */ }
if (/[?&]hc=1\b/.test(location.search)) HC = true;   // mở thẳng ở chế độ tương phản cao: ...?hc=1
function setHC(v) {
  HC = !!v;
  try { localStorage.setItem("chonoi_hc", HC ? "1" : "0"); } catch (e) { /* bỏ qua */ }
  cv.style.filter = HC ? "contrast(1.5) saturate(1.2)" : "";
}
setHC(HC);
function lift(c) {   // HC: chữ sáng -> gần trắng, chữ tối (trên nền sáng) -> đen
  if (!HC) return c;
  if (!c) return "#ffffff";
  if (c[0] !== "#" || c.length !== 7) return c;
  const n = parseInt(c.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if ((0.2126 * r + 0.7152 * g + 0.0722 * b) / 255 < 0.35) return "#000000";
  const m = (v) => Math.round(v + (255 - v) * 0.6);
  return `rgb(${m(r)},${m(g)},${m(b)})`;
}
function withHalo(fn) {   // HC: viền sáng quanh nhân vật / cá / thủy quái để dễ tách khỏi nền
  if (HC) { ctx.shadowColor = "#ffffff"; ctx.shadowBlur = 6; }
  fn();
  ctx.shadowBlur = 0; ctx.shadowColor = "transparent";
}

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? (snap.phase || snap.mode) : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function keyName(e) { return e.key.toLowerCase(); }
function restart() { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); toasts.length = 0; lastEventTick = 0; }
function post(path, obj) { return fetch(path, { method: "POST", body: JSON.stringify(obj || {}), headers: { "Content-Type": "application/json" } }).catch(() => {}); }
async function pulse(name) { await post("/input", { [name]: true }); await post("/input", { [name]: false }); }   // nhấn một lần (cạnh lên)
function goOn() { down.clear(); lastSent = ""; post("/continue"); }                                             // qua "màn chờ"
const SHOP_KEYS = { "1": "oxygen", "2": "hp" };
let hits = [];   // vùng bấm chuột của khung hình hiện tại
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (k === "r") { restart(); return; }
  if (k === "h") { setHC(!HC); return; }                                                       // tương phản cao: bật/tắt ở mọi màn
  if (!snap) return;
  if (snap.screen) { if (k === "enter" || k === " ") { e.preventDefault(); goOn(); } return; }   // màn chờ: Enter/Space/click để tiếp tục
  if (k === "escape" || k === "p") { pulse("pause"); return; }
  if (snap.state === "paused") return;
  if ((snap.phase || snap.mode) === "shop") {                                                    // cửa hàng: 1/2 mua, Enter xong
    if (SHOP_KEYS[k]) post("/input", { buy: SHOP_KEYS[k] });
    else if (k === "enter") pulse("shop_done");
    return;
  }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  pushInput();
});
addEventListener("click", (e) => {
  if (!snap) return;
  if (snap.screen) { goOn(); return; }
  for (const h of hits) if (e.clientX >= h.x && e.clientX <= h.x + h.w && e.clientY >= h.y && e.clientY <= h.y + h.h) { h.fn(); return; }
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
    collectToasts();
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- tên, màu ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#cfe3f1", ca_keo: "#c8a15c", bong_dien_dien: "#f2c230", bong_sung: "#ef8fb0", keo_neo: "#6fbf5a" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "bông điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const DISH = {
  ca_loc_nuong_trui: { name: "Cá lóc nướng trui", color: "#9bb866" },
  goi_bong_sung: { name: "Gỏi bông súng", color: "#ef8fb0" },
  lau_ca_linh_dien_dien: { name: "Lẩu cá linh điên điển", color: "#f2c230" },
  canh_chua_ca_loc: { name: "Canh chua cá lóc", color: "#e8a050" },
  ca_keo_nuong: { name: "Cá kèo nướng", color: "#d9a066" },
  lau_mam: { name: "Lẩu mắm", color: "#b58a5a" },
};
const UPGRADE_NAME = { oxygen: "bình oxy", hp: "thêm Máu" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";
const kn = (k) => KIND_NAME[k] || k;
const dishName = (id) => (DISH[id] ? DISH[id].name : id || "?");
const dishColor = (id) => (DISH[id] ? DISH[id].color : "#ddd");
const dishOf = (x) => (x && typeof x === "object" ? x.dish_id : x);
const isFish = (k) => k === "ca_loc" || k === "ca_linh" || k === "ca_keo";
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const now = () => performance.now() / 1000;

// ---------- thông báo nhanh từ event ----------
const toasts = [];
let lastEventTick = 0, lastTick = 0;
const GOOD = "#8fe3a0", BAD = "#ff8f8f", INFO = "#ffe08a";
function eventText(e) {
  const d = e.data || {};
  switch (e.name) {
    case "gather": return [`Hái được ${kn(d.kind)} ×${d.amount ?? 1}`, GOOD];
    case "fish_caught": return [`Bắt được ${kn(d.kind)} ×${d.yield ?? 1}`, GOOD];
    case "hold_full": return ["Giỏ đầy rồi!", BAD];
    case "node_regrown": return [`Nút ${d.node_id} đã mọc lại`, INFO];
    case "oxygen_empty": return ["Hết oxy! Nổi lên mau!", BAD];
    case "choke": return [`Ngạt! Còn ${d.hp} Máu`, BAD];
    case "faint": return [d.cause === "monster" ? "Thủy quái đánh ngất Út Sen!" : "Út Sen ngất rồi…", BAD];
    case "monster_hit": return [`Thủy quái! Mất ${(d.lost || []).length} món, còn ${d.hp} Máu`, BAD];
    case "spoiled": return [`Hàng ươn: ${kn(d.kind)}${d.item_id || d.id ? " " + (d.item_id || d.id) : ""}`, BAD];
    case "paused": return ["Tạm dừng", INFO];
    case "resumed": return ["Tiếp tục", INFO];
    case "bought": return [`Đã mua ${UPGRADE_NAME[d.upgrade] || d.upgrade} cấp ${d.level} (−${d.price}k)`, GOOD];
    case "buy_failed": return [{ funds: "Không đủ tiền", max_level: "Đã nâng cấp tối đa", unknown: "Không có món đó" }[d.reason] || "Không mua được", BAD];
    case "customer_arrived": return [`Khách mới ở ${d.table_id}: ${dishName(d.dish_id)}`, INFO];
    case "no_dish": return ["Kho không đủ nguyên liệu cho món nào", BAD];
    case "cook_started": return [`Bắt đầu nấu ${dishName(d.dish_id)}`, INFO];
    case "dish_ready": return [`${dishName(d.dish_id)} chín rồi!`, GOOD];
    case "dish_picked": return [`Đã lấy ${dishName(d.dish_id)}`, INFO];
    case "served": return [`Đã phục vụ ${d.table_id}` + (d.tip ? ` (boa ${d.tip}k)` : ""), GOOD];
    case "paid": return [`+${d.amount}k từ ${d.table_id}`, GOOD];
    case "customer_left": return [d.reason === "patience" ? `Khách ${d.table_id} bỏ đi vì chờ lâu` : `Khách ${d.table_id} rời quán`, BAD];
    default: return null;
  }
}
function collectToasts() {
  if (!snap) return;
  if (snap.tick < lastTick) { toasts.length = 0; lastEventTick = 0; }   // chơi lại
  lastTick = snap.tick;
  (snap.events || []).forEach((e) => {
    if (e.tick <= lastEventTick) return;
    const t = eventText(e);
    if (t) toasts.push({ text: t[0], color: t[1], born: now() });
  });
  const evs = snap.events || [];
  if (evs.length) lastEventTick = Math.max(lastEventTick, evs[evs.length - 1].tick);
  while (toasts.length > 6) toasts.shift();
}

// ---------- vẽ cơ bản ----------
function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.bold ? "bold " : "") + (o.size || 14) + "px system-ui, 'Segoe UI', sans-serif";
  ctx.fillStyle = lift(o.color || "#f3e9d8");
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function panel(x, y, w, h, alpha = 0.62) {
  rr(x, y, w, h, 10); ctx.fillStyle = HC ? "rgba(0,0,0,.96)" : `rgba(27,20,16,${alpha})`; ctx.fill();
  ctx.strokeStyle = HC ? "#ffffff" : "rgba(243,233,216,.18)"; ctx.lineWidth = HC ? 2 : 1; ctx.stroke();
}
function bar(x, y, w, h, frac, color, label) {
  rr(x, y, w, h, h / 2); ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fill();
  const fw = w * clamp01(frac);
  if (fw > 0) { ctx.save(); rr(x, y, w, h, h / 2); ctx.clip(); ctx.fillStyle = color; ctx.fillRect(x, y, fw, h); ctx.restore(); }
  rr(x + .5, y + .5, w - 1, h - 1, h / 2); ctx.strokeStyle = HC ? "#ffffff" : "rgba(255,255,255,.4)"; ctx.lineWidth = HC ? 2 : 1; ctx.stroke();
  if (label) text(label, x + w / 2, y + h / 2, { size: Math.max(10, h - 6), align: "center", base: "middle", bold: true });
}
function ring(x, y, r, frac, color, width = 4) {
  ctx.lineWidth = width; ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = color; ctx.beginPath(); ctx.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp01(frac)); ctx.stroke();
}
function fmtTime(ticks) {
  const s = Math.ceil((ticks || 0) / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
// ---- kho cá thể (Contract v1.2): hold[] / stock[] là mảng {id, kind, fresh}; vẫn nhận dạng cũ (chuỗi kind, hoặc object kind -> số lượng)
function asItems(v) {
  if (Array.isArray(v)) return v.map((e) => (e && typeof e === "object" ? e : { id: null, kind: e, fresh: null }));
  return Object.keys(v || {}).sort().flatMap((k) => Array.from({ length: v[k] }, () => ({ id: null, kind: k, fresh: null })));
}
const spoiledBelow = () => (snap && snap.freshness && snap.freshness.spoiled_below) || 30;   // ngưỡng ươn: lấy từ contract nếu có
const isSpoiled = (it) => it.fresh != null && it.fresh < spoiledBelow();
function kindCounts(v) { const o = {}; asItems(v).forEach((it) => { o[it.kind] = (o[it.kind] || 0) + 1; }); return o; }
const freshColor = (f) => (f == null ? "#9fb3c0" : f < spoiledBelow() ? "#c46a4a" : f < 60 ? "#e8c040" : "#7bd88f");
function itemSummary(items) {   // "cá lóc ×2 (tươi 85%), cá linh ×1 (1 ươn)"
  const g = {};
  items.forEach((it) => { (g[it.kind] = g[it.kind] || []).push(it); });
  const ks = Object.keys(g).sort();
  return ks.length ? ks.map((k) => {
    const a = g[k], known = a.filter((x) => x.fresh != null), bad = a.filter(isSpoiled).length, extra = [];
    if (known.length) extra.push(`tươi ${Math.round(known.reduce((s, x) => s + x.fresh, 0) / known.length)}%`);
    if (bad) extra.push(`${bad} ươn`);
    return `${kn(k)} ×${a.length}` + (extra.length ? ` (${extra.join(", ")})` : "");
  }).join(", ") : "(trống)";
}
function itemList(items) {
  const ks = Object.keys(items || {}).filter((k) => items[k] > 0);
  return ks.length ? ks.map((k) => `${kn(k)} ×${items[k]}`).join(", ") : "(trống)";
}
// biểu tượng nguyên liệu: cá là hình cá, bông là hình hoa
// cá lóc: thân dài hình trụ, đầu dẹt, vây lưng chạy dọc, sọc tối, đuôi tròn (r ~ cỡ cá linh; chiều dài ≈ 2.8r)
function snakehead(x, y, r) {
  const L = r * 1.05, H = r * 0.3;
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = "#4a5a2c";                       // vây lưng dài
  ctx.beginPath(); ctx.moveTo(-L * 0.9, -H * 0.55);
  for (let i = 0; i <= 8; i++) ctx.lineTo(-L * 0.9 + i * L * 0.2, -H * (0.8 + 0.32 * (i % 2 ? 1 : 0.6)));
  ctx.lineTo(L * 0.7, -H * 0.55); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-L * 0.78, 0);       // đuôi tròn
  ctx.quadraticCurveTo(-L * 1.15, -H * 1.0, -L * 1.5, -H * 0.8); ctx.quadraticCurveTo(-L * 1.7, 0, -L * 1.5, H * 0.8);
  ctx.quadraticCurveTo(-L * 1.15, H * 1.0, -L * 0.78, 0); ctx.fill();
  ctx.fillStyle = "#6f8340";                       // thân + đầu dẹt
  ctx.beginPath(); ctx.moveTo(-L * 0.85, -H * 0.62);
  ctx.quadraticCurveTo(0, -H * 1.18, L * 0.78, -H * 0.72);
  ctx.quadraticCurveTo(L * 1.28, -H * 0.4, L * 1.35, H * 0.05);
  ctx.quadraticCurveTo(L * 1.2, H * 0.55, L * 0.75, H * 0.72);
  ctx.quadraticCurveTo(0, H * 1.08, -L * 0.85, H * 0.62); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#d8d49a";                       // bụng sáng
  ctx.beginPath(); ctx.moveTo(-L * 0.8, H * 0.5); ctx.quadraticCurveTo(0, H * 1.0, L * 0.72, H * 0.66);
  ctx.quadraticCurveTo(0, H * 0.62, -L * 0.8, H * 0.5); ctx.fill();
  ctx.strokeStyle = "rgba(28,38,14,.6)"; ctx.lineWidth = Math.max(1, r * 0.13);   // sọc
  for (let i = 0; i < 4; i++) { const bx = -L * 0.55 + i * L * 0.38; ctx.beginPath(); ctx.moveTo(bx, -H * 0.8); ctx.lineTo(bx + L * 0.12, H * 0.25); ctx.stroke(); }
  ctx.strokeStyle = "rgba(28,38,14,.7)"; ctx.lineWidth = Math.max(1, r * 0.08);   // miệng
  ctx.beginPath(); ctx.moveTo(L * 1.32, H * 0.12); ctx.lineTo(L * 0.92, H * 0.22); ctx.stroke();
  ctx.fillStyle = "#fff6d0"; ctx.beginPath(); ctx.arc(L * 0.95, -H * 0.22, Math.max(1.2, r * 0.13), 0, Math.PI * 2); ctx.fill();   // mắt
  ctx.fillStyle = "#101810"; ctx.beginPath(); ctx.arc(L * 0.98, -H * 0.22, Math.max(0.8, r * 0.07), 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function icon(kind, x, y, r) {
  ctx.fillStyle = kc(kind);
  if (kind === "ca_loc") snakehead(x, y, r * 0.8);
  else if (kind === "keo_neo") {          // kèo nèo: bụi cỏ nước xanh, đầu hoa vàng nhỏ
    ctx.strokeStyle = "#5fae4a"; ctx.lineWidth = Math.max(1.5, r * 0.22); ctx.lineCap = "round";
    for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(x + i * r * 0.25, y + r * 0.5); ctx.quadraticCurveTo(x + i * r * 0.7, y - r * 0.2, x + i * r * 0.9, y - r * 0.9); ctx.stroke(); }
    ctx.lineCap = "butt";
    ctx.fillStyle = "#ffd84a"; ctx.beginPath(); ctx.arc(x + r * 0.9, y - r * 0.95, r * 0.2, 0, Math.PI * 2); ctx.fill();
  } else if (kind === "ca_linh") silverFish(x, y, r);
  else if (kind === "ca_keo") goby(x, y, r);
  else if (isFish(kind)) {
    ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.55, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - r * 0.8, y); ctx.lineTo(x - r * 1.5, y - r * 0.55); ctx.lineTo(x - r * 1.5, y + r * 0.55); ctx.fill();
    ctx.fillStyle = "#12202b"; ctx.beginPath(); ctx.arc(x + r * 0.5, y - r * 0.12, Math.max(1, r * 0.12), 0, Math.PI * 2); ctx.fill();
  } else {
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2;
      ctx.beginPath(); ctx.ellipse(x + Math.cos(a) * r * 0.5, y + Math.sin(a) * r * 0.5, r * 0.5, r * 0.3, a, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "#fff4c2"; ctx.beginPath(); ctx.arc(x, y, r * 0.22, 0, Math.PI * 2); ctx.fill();
  }
}
function drawToasts(w, h) {
  const t = now();
  for (let i = toasts.length - 1; i >= 0; i--) if (t - toasts[i].born > 3.2) toasts.splice(i, 1);
  toasts.forEach((n, i) => {
    const age = t - n.born, a = clamp01(Math.min(1, (3.2 - age) / 0.6));
    const y = 170 + (toasts.length - 1 - i) * 26;
    ctx.globalAlpha = a;
    ctx.font = "bold 14px system-ui, sans-serif";
    const tw = ctx.measureText(n.text).width + 24;
    rr(w / 2 - tw / 2, y - 16, tw, 24, 12); ctx.fillStyle = "rgba(27,20,16,.75)"; ctx.fill();
    text(n.text, w / 2, y - 4, { align: "center", color: n.color, bold: true, base: "middle", size: 14 });
    ctx.globalAlpha = 1;
  });
}
function drawPrompt(msg, w, y) {
  if (!msg || snap.finished) return;
  ctx.font = "bold 15px system-ui, sans-serif";
  const tw = ctx.measureText(msg).width + 28;
  rr(w / 2 - tw / 2, y - 18, tw, 30, 15); ctx.fillStyle = "rgba(255,224,138,.92)"; ctx.fill();

function hash32(str) { let h = 2166136261; String(str).split("").forEach((c) => { h = Math.imul(h ^ c.charCodeAt(0), 16777619); }); return (h ^ (h >>> 13)) >>> 0; }
const SHIRTS = ["#4f7fb5", "#5a9a6a", "#b86fa0", "#c8a23a", "#7a6ab5", "#c26a5a"], HAIRS = ["#1b1411", "#33211a", "#6e6e72", "#1b1411"], SKINS = ["#f1c9a2", "#e6b588", "#d49a6a"];
function guestLook(id) {   // dáng khách suy ra từ id (cố định theo khách, không dùng ngẫu nhiên)
  const h = hash32(id);
  return { shirt: SHIRTS[h % 6], hair: HAIRS[(h >> 3) % 4], skin: SKINS[(h >> 5) % 3], hat: (h >> 7) % 3 === 0, braid: (h >> 9) % 2 === 0, scarf: (h >> 11) % 4 === 0 };
}

// Người nhìn chính diện (chibi): bóng, chân, áo bà ba, tay, đầu, tóc, mặt. (x, y) là bàn chân; u ≈ chiều cao / 1.75.
function person(x, y, u, o) {
  const t = o.t || 0, walk = !!o.walk, bob = walk ? Math.sin(t * 12) : 0;
  const skin = o.skin || "#f1c9a2", shirt = o.shirt || "#4f7fb5", pants = o.pants || "#2f2a28", hair = o.hair || "#1b1411";
  ctx.save(); ctx.translate(x, y);
  if (o.face < 0) ctx.scale(-1, 1);
  ctx.fillStyle = "rgba(0,0,0,.28)"; ctx.beginPath(); ctx.ellipse(0, 0.02 * u, 0.44 * u, 0.12 * u, 0, 0, TAU); ctx.fill();   // bóng
  if (!o.seated) [-1, 1].forEach((sd) => {                                                                                 // chân + dép
    const lift = walk ? Math.max(0, bob * sd) * 0.1 * u : 0;
    ctx.fillStyle = pants; rr(sd * 0.14 * u - 0.09 * u, -0.56 * u - lift, 0.18 * u, 0.5 * u, 0.06 * u); ctx.fill();
    ctx.fillStyle = "#6b4a2a"; ctx.beginPath(); ctx.ellipse(sd * 0.14 * u, -lift, 0.12 * u, 0.06 * u, 0, 0, TAU); ctx.fill();
  });
  const ty = -1.14 * u;
  ctx.fillStyle = shirt; rr(-0.33 * u, ty, 0.66 * u, 0.64 * u, 0.2 * u); ctx.fill();                                        // thân áo
  ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.lineWidth = Math.max(1, 0.025 * u); ctx.beginPath(); ctx.moveTo(0, ty + 0.12 * u); ctx.lineTo(0, ty + 0.62 * u); ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,.75)"; [0.26, 0.4, 0.54].forEach((k) => { ctx.beginPath(); ctx.arc(0, ty + k * u, 0.025 * u, 0, TAU); ctx.fill(); });   // nút áo bà ba
  ctx.fillStyle = skin; ctx.beginPath(); ctx.moveTo(-0.1 * u, ty); ctx.lineTo(0.1 * u, ty); ctx.lineTo(0, ty + 0.16 * u); ctx.fill();                              // cổ
  if (o.scarf) {                                                                                                            // khăn rằn quàng cổ
    ctx.fillStyle = "#b5282a"; rr(-0.36 * u, ty - 0.02 * u, 0.72 * u, 0.17 * u, 0.08 * u); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.lineWidth = Math.max(1, 0.02 * u); ctx.beginPath();
    for (let k = 0; k < 7; k++) { ctx.moveTo(-0.33 * u + k * 0.11 * u, ty); ctx.lineTo(-0.33 * u + k * 0.11 * u, ty + 0.14 * u); } ctx.stroke();
  }
  [-1, 1].forEach((sd) => {                                                                                                 // tay
    const sh = [sd * 0.34 * u, ty + 0.1 * u];
    const hd = o.carry ? [sd * 0.2 * u, ty + 0.5 * u] : [sd * 0.42 * u, ty + 0.5 * u - (walk ? bob * sd * 0.06 * u : 0)];
    ctx.strokeStyle = shirt; ctx.lineWidth = 0.16 * u; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(sh[0], sh[1]); ctx.lineTo(hd[0], hd[1]); ctx.stroke(); ctx.lineCap = "butt";
    ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(hd[0], hd[1] + 0.02 * u, 0.075 * u, 0, TAU); ctx.fill();
  });
  const hy = -1.46 * u, hr = 0.31 * u;
  if (o.braid) {                                                                                                            // bím tóc buộc nơ
    ctx.strokeStyle = hair; ctx.lineWidth = 0.13 * u; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(0.2 * u, hy + 0.1 * u); ctx.quadraticCurveTo(0.42 * u, hy + 0.35 * u, 0.32 * u, hy + 0.72 * u); ctx.stroke(); ctx.lineCap = "butt";
    ctx.fillStyle = "#d6405a"; ctx.beginPath(); ctx.arc(0.32 * u, hy + 0.74 * u, 0.055 * u, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(0, hy, hr, 0, TAU); ctx.fill();                                            // đầu
  ctx.fillStyle = o.angry ? "rgba(220,60,50,.6)" : "rgba(235,120,110,.35)";
  [-1, 1].forEach((sd) => { ctx.beginPath(); ctx.arc(sd * 0.18 * u, hy + 0.09 * u, 0.065 * u, 0, TAU); ctx.fill(); });        // má
  ctx.fillStyle = hair; ctx.beginPath(); ctx.arc(0, hy, hr * 1.05, Math.PI, 0); ctx.quadraticCurveTo(0.2 * u, hy - 0.13 * u, 0, hy - 0.09 * u); ctx.quadraticCurveTo(-0.2 * u, hy - 0.13 * u, -hr * 1.05, hy); ctx.fill();   // tóc
  if (o.headband) {                                                                                                         // khăn rằn buộc đầu (Út Sen)
    ctx.fillStyle = "#b5282a"; rr(-0.33 * u, hy - 0.17 * u, 0.66 * u, 0.1 * u, 0.05 * u); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = Math.max(1, 0.02 * u); ctx.beginPath();
    for (let k = 0; k < 6; k++) { ctx.moveTo(-0.27 * u + k * 0.108 * u, hy - 0.17 * u); ctx.lineTo(-0.27 * u + k * 0.108 * u, hy - 0.07 * u); } ctx.stroke();
  }
  if (o.hat) {                                                                                                              // nón lá
    ctx.fillStyle = "#dcc58a"; ctx.strokeStyle = "#a8905a"; ctx.lineWidth = Math.max(1, 0.02 * u);
    ctx.beginPath(); ctx.moveTo(0, hy - 0.66 * u); ctx.lineTo(0.66 * u, hy - 0.1 * u); ctx.quadraticCurveTo(0, hy + 0.04 * u, -0.66 * u, hy - 0.1 * u); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); [0.2, 0.4].forEach((k) => { ctx.moveTo(-0.66 * u * k * 1.2, hy - 0.1 * u); ctx.lineTo(0, hy - 0.66 * u); ctx.moveTo(0.66 * u * k * 1.2, hy - 0.1 * u); ctx.lineTo(0, hy - 0.66 * u); }); ctx.stroke();
    ctx.strokeStyle = "#c33"; ctx.lineWidth = Math.max(1, 0.025 * u); ctx.beginPath(); ctx.moveTo(-0.5 * u, hy - 0.06 * u); ctx.lineTo(-0.2 * u, hy + 0.3 * u); ctx.moveTo(0.5 * u, hy - 0.06 * u); ctx.lineTo(0.2 * u, hy + 0.3 * u); ctx.stroke();
  }
  ctx.fillStyle = "#1b1411"; [-1, 1].forEach((sd) => { ctx.beginPath(); ctx.arc(sd * 0.11 * u, hy + 0.03 * u, 0.034 * u, 0, TAU); ctx.fill(); });   // mắt
  ctx.strokeStyle = "#1b1411"; ctx.lineWidth = Math.max(1, 0.03 * u);
  if (o.angry) { ctx.beginPath(); ctx.moveTo(-0.2 * u, hy - 0.08 * u); ctx.lineTo(-0.05 * u, hy - 0.02 * u); ctx.moveTo(0.2 * u, hy - 0.08 * u); ctx.lineTo(0.05 * u, hy - 0.02 * u); ctx.stroke(); }   // lông mày cau
  if (o.mouth === "eat") { ctx.fillStyle = "#7a2a2a"; ctx.beginPath(); ctx.ellipse(0, hy + 0.17 * u, 0.07 * u, (0.03 + 0.03 * Math.abs(Math.sin(t * 8))) * u, 0, 0, TAU); ctx.fill(); }
  else if (o.mouth === "frown") { ctx.beginPath(); ctx.arc(0, hy + 0.27 * u, 0.09 * u, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(0, hy + 0.1 * u, 0.09 * u, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke(); }
  ctx.restore();
}

function tableArt(cx, cy, s, id) {   // bàn gỗ tròn: bóng, vành, mặt có vân gỗ, ống đũa, chén nước mắm
  const R = 0.95 * s;
  ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.beginPath(); ctx.ellipse(cx + 0.06 * s, cy + 0.12 * s, R * 1.02, R * 0.96, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = "#5b3720"; ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();

  ctx.strokeStyle = "rgba(60,30,10,.28)"; ctx.lineWidth = 1;
  [0.3, 0.5, 0.68].forEach((k, i) => { ctx.beginPath(); ctx.arc(cx, cy, R * k, 0.4 + i, 2.6 + i); ctx.stroke(); });
  ctx.strokeStyle = "rgba(255,230,190,.25)"; ctx.beginPath(); ctx.arc(cx, cy, R * 0.8, Math.PI * 1.1, Math.PI * 1.5); ctx.stroke();
  ctx.fillStyle = "#6b4a2a"; rr(cx - 0.62 * R, cy + 0.22 * R, 0.14 * R, 0.2 * R, 2); ctx.fill();                       // ống đũa
  ctx.strokeStyle = "#d9c08a"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(cx - 0.58 * R, cy + 0.22 * R); ctx.lineTo(cx - 0.52 * R, cy + 0.08 * R); ctx.moveTo(cx - 0.54 * R, cy + 0.22 * R); ctx.lineTo(cx - 0.56 * R, cy + 0.08 * R); ctx.stroke();
  ctx.fillStyle = "#e8e2d0"; ctx.beginPath(); ctx.ellipse(cx + 0.55 * R, cy + 0.3 * R, 0.13 * R, 0.09 * R, 0, 0, TAU); ctx.fill();   // chén nước mắm
  ctx.fillStyle = "#7a3a1a"; ctx.beginPath(); ctx.ellipse(cx + 0.55 * R, cy + 0.3 * R, 0.09 * R, 0.06 * R, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.92)"; rr(cx - 0.2 * R, cy + 0.6 * R, 0.4 * R, 0.2 * R, 4); ctx.fill();                  // bảng số bàn
  text(id || "", cx, cy + 0.7 * R, { size: Math.max(9, 0.17 * R), bold: true, align: "center", base: "middle", color: "#4a2f10" });
}

function stoveArt(st, cx, cy, s, t, menu) {   // bếp lò đất nung: thân gạch, miệng lò có lửa, nồi trên mặt bếp
  const hs = 0.95 * s, did = dishOf(st.dish), cook = st.state === "cooking", ready = st.state === "ready";
  ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.beginPath(); ctx.ellipse(cx, cy + hs * 0.88, hs * 1.1, hs * 0.26, 0, 0, TAU); ctx.fill();
  if (ready) { ctx.fillStyle = `rgba(143,227,160,${0.25 + 0.15 * Math.sin(t * 5)})`; ctx.beginPath(); ctx.arc(cx, cy - hs * 0.2, hs * 1.5, 0, TAU); ctx.fill(); }
  const bx = cx - hs * 0.85, bw = hs * 1.7, yTop = cy - hs * 0.2, bh = hs * 1.05;
  ctx.fillStyle = "#a4553a"; rr(bx, yTop, bw, bh, hs * 0.18); ctx.fill();                                                     // thân bếp
  ctx.strokeStyle = "rgba(60,25,15,.45)"; ctx.lineWidth = 1; ctx.beginPath();                                                // gạch
  for (let r = 1; r < 4; r++) { ctx.moveTo(bx, yTop + (bh * r) / 4); ctx.lineTo(bx + bw, yTop + (bh * r) / 4); }
  for (let r = 0; r < 4; r++) for (let c = 1; c < 5; c++) { const xx = bx + (bw * c) / 5 + (r % 2 ? bw / 10 : 0); if (xx < bx + bw - 2) { ctx.moveTo(xx, yTop + (bh * r) / 4); ctx.lineTo(xx, yTop + (bh * (r + 1)) / 4); } }
  ctx.stroke();
  ctx.fillStyle = "#1d1410"; rr(cx - hs * 0.38, yTop + bh * 0.4, hs * 0.76, bh * 0.52, hs * 0.2); ctx.fill();                  // miệng lò
  if (cook) {                                                                                                                 // lửa bập bùng + than hồng
    ctx.fillStyle = "rgba(255,160,60,.25)"; ctx.beginPath(); ctx.arc(cx, yTop + bh * 0.7, hs * 0.7, 0, TAU); ctx.fill();
    for (let i = -1; i <= 1; i++) {
      const fl = 0.55 + 0.35 * Math.sin(t * 9 + i * 2), fx = cx + i * hs * 0.2, fy = yTop + bh * 0.9;
      ctx.fillStyle = "#f2762a"; ctx.beginPath(); ctx.moveTo(fx - hs * 0.11, fy); ctx.quadraticCurveTo(fx - hs * 0.05, fy - hs * 0.45 * fl, fx, fy - hs * 0.55 * fl); ctx.quadraticCurveTo(fx + hs * 0.05, fy - hs * 0.4 * fl, fx + hs * 0.11, fy); ctx.fill();
      ctx.fillStyle = "#ffd75a"; ctx.beginPath(); ctx.moveTo(fx - hs * 0.05, fy); ctx.quadraticCurveTo(fx, fy - hs * 0.3 * fl, fx + hs * 0.05, fy); ctx.fill();
    }
  } else { ctx.fillStyle = "#5a2a1a"; [-0.15, 0.1].forEach((k) => { ctx.beginPath(); ctx.arc(cx + k * hs, yTop + bh * 0.85, hs * 0.06, 0, TAU); ctx.fill(); }); }
  ctx.fillStyle = "#6e2f20"; ctx.beginPath(); ctx.ellipse(cx, yTop, hs * 0.9, hs * 0.22, 0, 0, TAU); ctx.fill();               // mặt bếp
  ctx.fillStyle = "#7a4a22"; [[-1.08, 0.7, -0.15], [-1.1, 0.55, 0.1]].forEach((o) => { ctx.save(); ctx.translate(cx + o[0] * hs, cy + o[1] * hs); ctx.rotate(o[2]); rr(-hs * 0.22, -hs * 0.06, hs * 0.44, hs * 0.12, hs * 0.05); ctx.fill(); ctx.restore(); });   // củi
  if (ready) {                                                                                                                // món chín: bưng đĩa lên mặt bếp
    dishArt(did, cx, yTop - hs * 0.28, hs * 0.62, t);
    ctx.fillStyle = "#2f9e44"; ctx.beginPath(); ctx.arc(cx + hs * 0.62, yTop - hs * 0.75, hs * 0.22, 0, TAU); ctx.fill();
    text("✔", cx + hs * 0.62, yTop - hs * 0.75, { size: Math.max(12, hs * 0.3), align: "center", base: "middle", bold: true, color: "#ffffff" });
  } else {                                                                                                                    // nồi (có nắp)
    const px = cx, py = yTop - hs * 0.45;
    ctx.fillStyle = "#2d2d33"; rr(px - hs * 0.6, py, hs * 1.2, hs * 0.55, hs * 0.2); ctx.fill();
    ctx.fillStyle = "#3f3f48"; ctx.beginPath(); ctx.ellipse(px, py, hs * 0.62, hs * 0.2, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#5a5a64"; ctx.beginPath(); ctx.arc(px, py - hs * 0.12, hs * 0.07, 0, TAU); ctx.fill();
    ctx.fillStyle = "#1f1f24"; [-1, 1].forEach((sd) => rr(px + sd * hs * 0.66 - hs * 0.06, py + hs * 0.1, hs * 0.12, hs * 0.1, 3));
    ctx.fillStyle = "rgba(255,255,255,.12)"; rr(px - hs * 0.5, py + hs * 0.08, hs * 0.14, hs * 0.35, 4); ctx.fill();
    if (cook) {
      for (let i = 0; i < 3; i++) { const ph = (t * 0.6 + i / 3) % 1; ctx.fillStyle = `rgba(235,235,235,${0.5 * (1 - ph)})`; ctx.beginPath(); ctx.arc(px + Math.sin(ph * 5 + i) * s * 0.25, py - hs * 0.3 - ph * s * 1.2, s * (0.16 + 0.22 * ph), 0, TAU); ctx.fill(); }
      const tot = menu[did] ? menu[did].cook_s * 60 : 0;
      if (tot) ring(cx, cy - hs * 0.15, hs * 1.25, 1 - (st.cook_ticks_left || 0) / tot, "#ffd37a", 4);
      text(Math.ceil((st.cook_ticks_left || 0) / 60) + "s", px, py + hs * 0.3, { size: 13, align: "center", base: "middle", bold: true, color: "#ffffff" });
    }
  }
  text(st.id, cx, cy + hs + 16, { size: 12, align: "center", color: "#2a1a0a", bold: true });                                  // nhãn 2 dòng: mã bếp, rồi tên món (rút gọn cho vừa)
  if (did) text(fitText(dishName(did), s * 2.7, 11, false), cx, cy + hs + 30, { size: 11, align: "center", color: "#2a1a0a" });
}
function fitText(str, maxW, size, bold) {
  ctx.font = (bold ? "bold " : "") + size + "px system-ui, sans-serif";
  if (ctx.measureText(str).width <= maxW) return str;
  let r = str; while (r.length > 1 && ctx.measureText(r + "…").width > maxW) r = r.slice(0, -1);
  return r + "…";
}

// ====================== QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) ======================
// order_status theo PRD (reserved/assigned/served/unfulfillable) và theo sim hiện tại (waiting/cooking/eating): nhận cả hai
const ORDER_TEXT = { reserved: "chờ nấu", waiting: "chờ nấu", assigned: "đang làm món", cooking: "đang làm món",
                     served: "đang ăn", eating: "đang ăn", unfulfillable: "hết nguyên liệu" };
const isEating = (c) => c.state === "eating" || c.order_status === "served" || c.order_status === "eating";
const isPending = (c) => !isEating(c) && (c.order_status === "reserved" || c.order_status === "waiting");
function drawQuan(w, h) {
  const meta = snap.meta || {}, menu = snap.menu || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 92, bottom = 52, t = now();
  const sideW = w >= 900 ? 250 : 0;
  const s = Math.max(1, Math.min((w - 24 - sideW) / X, (h - top - bottom) / Z));
  const ox = 12 + (w - 24 - sideW - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  // nước quanh nhà bè + sàn gỗ
  ctx.fillStyle = "#2a3a3d"; ctx.fillRect(0, top - 10, w - sideW, h - top - bottom + 20);
  ctx.fillStyle = "#b78a55"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = "rgba(60,36,16,.35)"; ctx.lineWidth = 1;
  for (let x = 0; x <= X; x += 1) { ctx.beginPath(); ctx.moveTo(sx(x), sy(Z)); ctx.lineTo(sx(x), sy(0)); ctx.stroke(); }
  ctx.strokeStyle = "#5a3a1f"; ctx.lineWidth = 5; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  // đèn dây vàng
  ctx.strokeStyle = "rgba(40,28,16,.8)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(0), sy(Z) - 6); ctx.quadraticCurveTo(sx(X / 2), sy(Z) + 18, sx(X), sy(Z) - 6); ctx.stroke();
  for (let i = 0; i <= 14; i++) {
    const u = i / 14, bx = sx(X * u), by = sy(Z) - 6 + 4 * 2 * u * (1 - u) * 4.5;
    ctx.fillStyle = `rgba(255,214,102,${0.7 + 0.3 * Math.sin(t * 3 + i)})`; ctx.beginPath(); ctx.arc(bx, by, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,214,102,.12)"; ctx.beginPath(); ctx.arc(bx, by, 14, 0, Math.PI * 2); ctx.fill();
  }
  const p = snap.player;
  // hand: chuỗi dish_id (sim hiện tại) hoặc payload {order_id,dish_id,base_price} (PRD): nhận cả hai
  const hr = snap.hand;
  const hd = hr && typeof hr === "object" ? hr.dish_id : hr;
  const hand = hd ? { dish_id: hd, order_id: hr && typeof hr === "object" ? hr.order_id : null } : null;
  const customers = snap.customers || [];
  // kho khả dụng = kho trừ phần khách đang giữ chỗ (stock trong snapshot là kho vật lý, gồm cả phần giữ)
  // v1.2: stock[] là mảng cá thể, reserved là mảng ID → bỏ đúng các cá thể bị giữ; dạng cũ: trừ theo số lượng
  let availItems;
  if (Array.isArray(snap.stock)) {
    const rid = new Set(); customers.forEach((c) => Array.isArray(c.reserved) && c.reserved.forEach((id) => rid.add(id)));
    availItems = asItems(snap.stock).filter((it) => !rid.has(it.id));
  } else {
    const a = Object.assign({}, snap.stock || {});
    customers.forEach((c) => Object.keys(c.reserved || {}).forEach((k) => { a[k] = (a[k] || 0) - c.reserved[k]; }));
    Object.keys(a).forEach((k) => { a[k] = Math.max(0, a[k]); });
    availItems = asItems(a);
  }
  const avail = kindCounts(availItems), stockCnt = kindCounts(snap.stock);
  const cookableNow = (c) => { const rc = (menu[c.dish_id] || {}).recipe || {}; return Object.keys(rc).every((k) => (stockCnt[k] || 0) >= rc[k]); };
  const byTable = {}; customers.forEach((c) => (byTable[c.table_id] = c));
  const patTot = (meta.patience_s || 60) * 60;
  const angryOf = (c) => !isEating(c) && c.patience_ticks_left !== undefined && c.patience_ticks_left / patTot < 0.25;   // sắp hết kiên nhẫn
  const angry = customers.filter(angryOf);
  // ---- vẽ theo độ sâu (xa → gần): bếp, bàn (kèm khách), Út Sen; nhãn/biểu tượng ở lớp trên cùng ----
  const things = [], tops = [];
  const R = meta.interact_radius || 1.5;
  const pAt = p ? { x: sx(p.pos[0]), y: sy(p.pos[1]) } : null;
  let walking = false;
  if (p) {
    if (lastQ.pos) {
      if (Math.hypot(p.pos[0] - lastQ.pos[0], p.pos[1] - lastQ.pos[1]) > 0.002) lastQ.moveT = t;
      if (Math.abs(p.pos[0] - lastQ.pos[0]) > 0.002) lastQ.face = p.pos[0] > lastQ.pos[0] ? 1 : -1;
    }
    lastQ.pos = [p.pos[0], p.pos[1]];
    walking = t - lastQ.moveT < 0.15;
  }
  (snap.stoves || []).forEach((st) => {
    const cx = sx(st.pos[0]), cy = sy(st.pos[1]);
    things.push({ y: cy, fn: () => stoveArt(st, cx, cy, s, t, menu) });
  });
  (snap.tables || []).forEach((tb) => {
    const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]), c = byTable[tb.id];
    things.push({
      y: cy,
      fn: () => {
        if (c) {   // khách ngồi sau bàn: vẽ khách trước, rồi mặt bàn che nửa thân dưới
          const lk = guestLook(c.id), eat = isEating(c), ang = angryOf(c);
          withHalo(() => person(cx, cy - 0.15 * s, 0.85 * s, Object.assign({}, lk, { seated: true, t, face: 1, angry: ang, mouth: eat ? "eat" : ang ? "frown" : "smile" })));
        }
        tableArt(cx, cy, s, tb.id);
        if (c && isEating(c)) dishArt(c.dish_id, cx, cy - 0.02 * s, 0.5 * s, t);
      },
    });
    if (!c) return;
    tops.push(() => {
      const eat = isEating(c), label = dishName(c.dish_id), barY = cy - 2.05 * s;
      if (eat) bar(cx - 0.9 * s, barY, 1.8 * s, 8, 1 - (c.eat_ticks_left || 0) / ((meta.eat_s || 10) * 60), "#7bc67b");
      else if (c.patience_ticks_left !== undefined) {
        const f = c.patience_ticks_left / patTot;
        bar(cx - 0.9 * s, barY, 1.8 * s, 8, f, f > 0.5 ? "#7bc67b" : f > 0.25 ? "#f2c230" : "#ef5350");
        if (HC) text(Math.ceil(c.patience_ticks_left / 60) + "s", cx + 1.05 * s, barY + 8, { size: 12, bold: true });   // HC: có số giây, không chỉ màu
        if (angryOf(c)) {                                       // biểu tượng + chữ "sắp giận", nhấp nháy
          const on = Math.floor(t * 3) % 2, mx = cx + 0.85 * s, my = cy - 1.45 * s;
          ctx.fillStyle = on ? "#c4281c" : "#7a1710"; ctx.beginPath(); ctx.arc(mx, my, 0.3 * s, 0, TAU); ctx.fill();
          ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
          text("!", mx, my, { size: Math.max(12, 0.45 * s), bold: true, align: "center", base: "middle", color: "#ffffff" });
          text("sắp giận!", mx + 0.4 * s, my, { size: 13, bold: true, base: "middle", color: "#ffd0c8" });
        }
      }
      ctx.font = "bold 11px system-ui, sans-serif";                                                                      // bong bóng món gọi (có hình món)
      const bw = ctx.measureText(label).width + 44, bx = cx - bw / 2, by = barY - 36;
      rr(bx, by, bw, 30, 15); ctx.fillStyle = "rgba(255,248,230,.97)"; ctx.fill(); ctx.strokeStyle = "rgba(60,40,20,.35)"; ctx.lineWidth = 1; ctx.stroke();
      dishArt(c.dish_id, bx + 18, by + 15, 12, t);
      text(label, bx + 34, by + 15, { size: 11, bold: true, color: "#3a2a12", base: "middle" });
    });
  });
  if (p) {
    const fy = pAt.y + 0.45 * s, u = 0.85 * s;
    things.push({
      y: fy,
      fn: () => {
        withHalo(() => person(pAt.x, fy, u, { skin: "#f0c8a0", shirt: "#c9763f", hair: "#17110e", braid: true, headband: true, scarf: true, t, walk: walking, face: lastQ.face, carry: !!hand }));
        if (hand) dishArt(hand.dish_id, pAt.x, fy - 0.58 * s, 0.34 * s, t);                                              // món đang bưng trên tay
      },
    });
    tops.push(() => {
      ctx.strokeStyle = "rgba(255,255,255,.45)"; ctx.setLineDash([4, 4]); ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(pAt.x, pAt.y, R * s, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
      if (hand) text(dishName(hand.dish_id), pAt.x, fy - 1.72 * s, { size: 11, align: "center", bold: true, color: "#fff" });
    });
  }
  things.sort((a, b) => a.y - b.y).forEach((o) => o.fn());
  tops.forEach((fn) => fn());
  let prompt = "";
  if (p) {
    const cands = [];
    (snap.stoves || []).forEach((st) => cands.push({ d: dist(p.pos, st.pos), k: 0, st }));
    (snap.tables || []).forEach((tb) => { if (byTable[tb.id]) cands.push({ d: dist(p.pos, tb.pos), k: 1, tb, c: byTable[tb.id] }); });
    const near = cands.filter((x) => x.d <= R).sort((a, c) => a.d - c.d || a.k - c.k)[0];
    if (near) {
      if (near.st) {
        const st = near.st;
        if (st.state === "idle") {
          const pend = customers.filter(isPending);
          prompt = !pend.length ? "Bếp đang trống" : pend.some(cookableNow) ? "E: nấu món cho khách" : "Kho không đủ nguyên liệu";
        }
        else if (st.state === "cooking") prompt = "Đang nấu…";
        else prompt = hand ? "Tay đang cầm món rồi" : "E: lấy món";
      } else {
        const c = near.c;
        if (isEating(c)) prompt = "Khách đang ăn";
        else if (hand && (hand.order_id ? hand.order_id === c.id : hand.dish_id === c.dish_id)) prompt = "E: phục vụ";
        else if (hand) prompt = "Sai món — món này của bàn khác";
        else prompt = "Chưa có món để bưng";
      }
    }
  }
  // HUD trên
  panel(8, 8, w - 16 - sideW, 64);
  text("⏱ " + fmtTime(snap.time_left_ticks), 22, 42, { size: 22, bold: true });
  text(`${snap.money ?? 0}k`, 130, 44, { size: 22, bold: true, color: "#ffe08a" });
  const rep = snap.reputation ?? 0;
  for (let i = 0; i < 5; i++) {
    const f = clamp01(rep - i), x0 = 230 + i * 26;
    text("★", x0, 44, { size: 24, color: HC ? "rgba(255,255,255,.55)" : "rgba(255,255,255,.2)" });
    if (f > 0) { ctx.save(); ctx.beginPath(); ctx.rect(x0, 18, 26 * f, 40); ctx.clip(); text("★", x0, 44, { size: 24, color: "#ffd24a" }); ctx.restore(); }
  }
  text(`${rep.toFixed(1)}`, 365, 44, { size: 16, color: "#e7d9bf" });
  text(`Điểm ${snap.score ?? 0}`, 420, 44, { size: 16, color: "#e7d9bf" });
  text("Kho khả dụng: " + itemSummary(availItems), 22, 63, { size: 12, color: availItems.some(isSpoiled) ? "#ffb08a" : "#c9bba3" });
  if (snap.day) text(`Ngày ${snap.day}/${snap.days_target || "?"} · Tối`, w - sideW - 22, 30, { size: 13, bold: true, align: "right", color: "#ffe08a" });
  // khung bên: đơn + thực đơn (chế độ day: chỉ các món trong kế hoạch ngày)
  if (sideW) {
    const px0 = w - sideW + 4, tw = sideW - 56;
    panel(px0, 8, sideW - 12, h - 16 - 28);
    text("Đơn đang có", px0 + 14, 34, { size: 15, bold: true });
    let y = 50;
    if (!customers.length) text("Chưa có khách", px0 + 14, y + 8, { size: 12, color: "#c9bba3" });
    customers.forEach((c) => {
      dishArt(c.dish_id, px0 + 26, y + 13, 11, t);
      text(`${c.table_id} · ${dishName(c.dish_id)}`, px0 + 44, y + 8, { size: 12, bold: true });
      text(ORDER_TEXT[c.order_status] || c.order_status || "", px0 + 44, y + 22, { size: 11, color: "#c9bba3" });
      if (c.patience_ticks_left !== undefined && !isEating(c)) {
        const f = c.patience_ticks_left / ((meta.patience_s || 60) * 60);
        bar(px0 + 14, y + 28, sideW - 42, 7, f, f > 0.5 ? "#7bc67b" : f > 0.25 ? "#f2c230" : "#ef5350");
      }
      y += 44;
    });
    y = Math.max(y + 10, 150);
    const plan = planDishes(), hasPlan = Object.keys(plan).length > 0;
    text(hasPlan ? "Thực đơn hôm nay" : "Thực đơn", px0 + 14, y, { size: 15, bold: true });
    Object.keys(menu).filter((id) => !hasPlan || plan[id]).sort().forEach((id) => {
      if (y > h - 90) return;                                  // hết chỗ thì bỏ bớt, không tràn khung
      const m = menu[id], ok = Object.keys(m.recipe || {}).every((k) => (avail[k] || 0) >= m.recipe[k]);
      y += 22;
      ctx.globalAlpha = ok ? 1 : 0.45; dishArt(id, px0 + 26, y - 1, 11, t); ctx.globalAlpha = 1;   // hình món (mờ nếu thiếu nguyên liệu)
      wrapLines(`${dishName(id)} · ${m.price}k` + (hasPlan ? ` · ×${plan[id]}` : ""), tw - 12, 12, true).forEach((ln, i) => { text(ln, px0 + 44, y + i * 15, { size: 12, bold: true, color: ok ? "#f3e9d8" : "#8d8070" }); if (i) y += 15; });
      y += 14;
      wrapLines(`${itemList(m.recipe)} · ${m.cook_s}s`, tw - 12, 11).forEach((ln, i) => { text(ln, px0 + 44, y + i * 13, { size: 11, color: "#c9bba3" }); if (i) y += 13; });
    });
  }
  if (angry.length) banner(`⚠ Khách ${angry.map((c) => c.table_id).join(", ")} sắp giận! Phục vụ ngay`, w - sideW, 98, "#c4281c", true, t);
  drawPrompt(prompt, w - sideW, h - bottom - 6);
  text("WASD/mũi tên đi · E nấu / lấy món / phục vụ · H tương phản cao · R chơi lại", (w - sideW) - 10, h - 14, { size: 12, align: "right", color: "#c9bba3" });
}

function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  ctx.fillStyle = HC ? "#000000" : "#1b1410"; ctx.fillRect(0, 0, w, h);
  hits = [];
  if (snap) {
    const ph = snap.phase || snap.mode;
    if (ph === "shop") drawShop(w, h); else if (ph === "quan") drawQuan(w, h); else drawGather(w, h);
    drawToasts(w, h);
    overlay(w, h);
    if (snap.screen) drawScreen(w, h);
    else if (snap.state === "paused") drawPause(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
</body>
