<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1410; color: #f3e9d8; font: 14px/1.4 system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp của nhóm. CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Không tính luật: mọi con số hiển thị lấy từ snapshot / meta / menu. Trường chưa có thì bỏ qua.
 * Hiệu ứng (sóng, bong bóng, khói, đèn dây) chỉ dùng đồng hồ trình duyệt, KHÔNG đi vào sim nên headless không đổi.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? snap.mode : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function keyName(e) { return e.key.toLowerCase(); }
function restart() { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); toasts.length = 0; lastEventTick = 0; }
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") restart();
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
    collectToasts();
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- tên, màu ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#cfe3f1", bong_dien_dien: "#f2c230", bong_sung: "#ef8fb0" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", bong_dien_dien: "bông điên điển", bong_sung: "bông súng" };
const DISH = {
  ca_loc_nuong_trui: { name: "Cá lóc nướng trui", color: "#9bb866" },
  goi_bong_sung: { name: "Gỏi bông súng", color: "#ef8fb0" },
  lau_ca_linh_dien_dien: { name: "Lẩu cá linh điên điển", color: "#f2c230" },
};
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";
const kn = (k) => KIND_NAME[k] || k;
const dishName = (id) => (DISH[id] ? DISH[id].name : id || "?");
const dishColor = (id) => (DISH[id] ? DISH[id].color : "#ddd");
const dishOf = (x) => (x && typeof x === "object" ? x.dish_id : x);
const isFish = (k) => k === "ca_loc" || k === "ca_linh";
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const now = () => performance.now() / 1000;

// ---------- thông báo nhanh từ event ----------
const toasts = [];
let lastEventTick = 0, lastTick = 0;
const GOOD = "#8fe3a0", BAD = "#ff8f8f", INFO = "#ffe08a";
function eventText(e) {
  const d = e.data || {};
  switch (e.name) {
    case "gather": return [`Hái được ${kn(d.kind)} ×${d.amount ?? 1}`, GOOD];
    case "fish_caught": return [`Bắt được ${kn(d.kind)} ×${d.yield ?? 1}`, GOOD];
    case "hold_full": return ["Giỏ đầy rồi!", BAD];
    case "node_regrown": return [`Nút ${d.node_id} đã mọc lại`, INFO];
    case "oxygen_empty": return ["Hết oxy! Nổi lên mau!", BAD];
    case "choke": return [`Ngạt! Còn ${d.hp} Máu`, BAD];
    case "faint": return ["Út Sen ngất rồi…", BAD];
    case "customer_arrived": return [`Khách mới ở ${d.table_id}: ${dishName(d.dish_id)}`, INFO];
    case "no_dish": return ["Kho không đủ nguyên liệu cho món nào", BAD];
    case "cook_started": return [`Bắt đầu nấu ${dishName(d.dish_id)}`, INFO];
    case "dish_ready": return [`${dishName(d.dish_id)} chín rồi!`, GOOD];
    case "dish_picked": return [`Đã lấy ${dishName(d.dish_id)}`, INFO];
    case "served": return [`Đã phục vụ ${d.table_id}` + (d.tip ? ` (boa ${d.tip}k)` : ""), GOOD];
    case "paid": return [`+${d.amount}k từ ${d.table_id}`, GOOD];
    case "customer_left": return [d.reason === "patience" ? `Khách ${d.table_id} bỏ đi vì chờ lâu` : `Khách ${d.table_id} rời quán`, BAD];
    default: return null;
  }
}
function collectToasts() {
  if (!snap) return;
  if (snap.tick < lastTick) { toasts.length = 0; lastEventTick = 0; }   // chơi lại
  lastTick = snap.tick;
  (snap.events || []).forEach((e) => {
    if (e.tick <= lastEventTick) return;
    const t = eventText(e);
    if (t) toasts.push({ text: t[0], color: t[1], born: now() });
  });
  const evs = snap.events || [];
  if (evs.length) lastEventTick = Math.max(lastEventTick, evs[evs.length - 1].tick);
  while (toasts.length > 6) toasts.shift();
}

// ---------- vẽ cơ bản ----------
function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.bold ? "bold " : "") + (o.size || 14) + "px system-ui, 'Segoe UI', sans-serif";
  ctx.fillStyle = o.color || "#f3e9d8";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function panel(x, y, w, h, alpha = 0.62) {
  rr(x, y, w, h, 10); ctx.fillStyle = `rgba(27,20,16,${alpha})`; ctx.fill();
  ctx.strokeStyle = "rgba(243,233,216,.18)"; ctx.lineWidth = 1; ctx.stroke();
}
function bar(x, y, w, h, frac, color, label) {
  rr(x, y, w, h, h / 2); ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fill();
  const fw = w * clamp01(frac);
  if (fw > 0) { ctx.save(); rr(x, y, w, h, h / 2); ctx.clip(); ctx.fillStyle = color; ctx.fillRect(x, y, fw, h); ctx.restore(); }
  rr(x + .5, y + .5, w - 1, h - 1, h / 2); ctx.strokeStyle = "rgba(255,255,255,.4)"; ctx.lineWidth = 1; ctx.stroke();
  if (label) text(label, x + w / 2, y + h / 2, { size: Math.max(10, h - 6), align: "center", base: "middle", bold: true });
}
function ring(x, y, r, frac, color, width = 4) {
  ctx.lineWidth = width; ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = color; ctx.beginPath(); ctx.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp01(frac)); ctx.stroke();
}
function fmtTime(ticks) {
  const s = Math.ceil((ticks || 0) / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function itemList(items) {
  const ks = Object.keys(items || {}).filter((k) => items[k] > 0);
  return ks.length ? ks.map((k) => `${kn(k)} ×${items[k]}`).join(", ") : "(trống)";
}
// biểu tượng nguyên liệu: cá là hình cá, bông là hình hoa
function icon(kind, x, y, r) {
  ctx.fillStyle = kc(kind);
  if (isFish(kind)) {
    ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.55, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - r * 0.8, y); ctx.lineTo(x - r * 1.5, y - r * 0.55); ctx.lineTo(x - r * 1.5, y + r * 0.55); ctx.fill();
    ctx.fillStyle = "#12202b"; ctx.beginPath(); ctx.arc(x + r * 0.5, y - r * 0.12, Math.max(1, r * 0.12), 0, Math.PI * 2); ctx.fill();
  } else {
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2;
      ctx.beginPath(); ctx.ellipse(x + Math.cos(a) * r * 0.5, y + Math.sin(a) * r * 0.5, r * 0.5, r * 0.3, a, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "#fff4c2"; ctx.beginPath(); ctx.arc(x, y, r * 0.22, 0, Math.PI * 2); ctx.fill();
  }
}
function drawToasts(w, h) {
  const t = now();
  for (let i = toasts.length - 1; i >= 0; i--) if (t - toasts[i].born > 3.2) toasts.splice(i, 1);
  toasts.forEach((n, i) => {
    const age = t - n.born, a = clamp01(Math.min(1, (3.2 - age) / 0.6));
    const y = 120 + (toasts.length - 1 - i) * 26;
    ctx.globalAlpha = a;
    ctx.font = "bold 14px system-ui, sans-serif";
    const tw = ctx.measureText(n.text).width + 24;
    rr(w / 2 - tw / 2, y - 16, tw, 24, 12); ctx.fillStyle = "rgba(27,20,16,.75)"; ctx.fill();
    text(n.text, w / 2, y - 4, { align: "center", color: n.color, bold: true, base: "middle", size: 14 });
    ctx.globalAlpha = 1;
  });
}
function drawPrompt(msg, w, y) {
  if (!msg || snap.finished) return;
  ctx.font = "bold 15px system-ui, sans-serif";
  const tw = ctx.measureText(msg).width + 28;
  rr(w / 2 - tw / 2, y - 18, tw, 30, 15); ctx.fillStyle = "rgba(255,224,138,.92)"; ctx.fill();
  text(msg, w / 2, y - 3, { align: "center", color: "#3a2a12", bold: true, base: "middle", size: 15 });
}
function overlay(w, h) {
  if (offline) text("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 30, { align: "center", color: "#ff8a80", size: 16 });
  if (snap.error) text("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w / 2, 52, { align: "center", color: "#ff8a80", size: 15 });
  if (!snap.finished) return;
  ctx.fillStyle = "rgba(10,6,4,.62)"; ctx.fillRect(0, 0, w, h);
  const bw = Math.min(460, w - 24), bx = (w - bw) / 2, by = h / 2 - 120;
  panel(bx, by, bw, 240, 0.92);
  const lines = [];
  if (snap.mode === "gather") {
    const why = { time: "Hết giờ", docked: "Đã cập bến", fainted: "Út Sen ngất — mất hết giỏ", error: "Lỗi" }[snap.reason] || snap.reason || "";
    const end = (snap.events || []).filter((e) => e.name === "gather_end").pop();
    const items = end && end.data && end.data.inventory ? end.data.inventory.items : null;
    text("Buổi sáng kết thúc", w / 2, by + 44, { align: "center", size: 24, bold: true });
    text(why, w / 2, by + 76, { align: "center", size: 17, color: snap.reason === "fainted" ? BAD : GOOD });
    text("Mang về quán:", w / 2, by + 114, { align: "center", size: 13, color: "#c9bba3" });
    text(itemList(items || {}), w / 2, by + 138, { align: "center", size: 16 });
  } else {
    text("Hết ca tối", w / 2, by + 44, { align: "center", size: 24, bold: true });
    text(`Thu nhập ${snap.earned ?? 0}k · Uy tín ${(snap.reputation ?? 0).toFixed(1)}`, w / 2, by + 86, { align: "center", size: 17 });
    text(`Điểm ${snap.score ?? 0}`, w / 2, by + 122, { align: "center", size: 26, bold: true, color: INFO });
  }
  text("Nhấn R để chơi lại", w / 2, by + 206, { align: "center", color: "#c9bba3", size: 14 });
}

// ====================== GATHER: nhìn ngang, x sang phải, d xuống ======================
function palm(x, baseY, hgt, lean) {
  ctx.strokeStyle = "#3b2a1a"; ctx.lineWidth = Math.max(3, hgt * 0.07);
  const tx = x + lean * hgt, ty = baseY - hgt;
  ctx.beginPath(); ctx.moveTo(x, baseY); ctx.quadraticCurveTo(x + lean * hgt * 0.2, baseY - hgt * 0.6, tx, ty); ctx.stroke();
  ctx.strokeStyle = "#2f6b3a"; ctx.lineWidth = Math.max(2, hgt * 0.05);
  for (let i = -3; i <= 3; i++) {
    const a = -Math.PI / 2 + i * 0.5;
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.quadraticCurveTo(tx + Math.cos(a) * hgt * 0.5, ty + Math.sin(a) * hgt * 0.35 - hgt * 0.1, tx + Math.cos(a) * hgt * 0.7, ty + Math.sin(a) * hgt * 0.35 + hgt * 0.25); ctx.stroke();
  }
}
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 7;
  const top0 = 76, bottom = 96, t = now();
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top0 - bottom) / (D + SKY + 1)));
  const top = top0 + Math.max(0, (h - top0 - bottom - s * (D + SKY + 1)) / 2);   // căn giữa theo chiều dọc
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  const p = snap.player;
  const underwater = p ? (p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface) : false;
  // trời ban mai hồng
  const sky = ctx.createLinearGradient(0, top, 0, oy);
  sky.addColorStop(0, "#f7b6a3"); sky.addColorStop(1, "#fde7c8");
  ctx.fillStyle = sky; ctx.fillRect(0, top, w, SKY * s);
  ctx.fillStyle = "rgba(255,244,214,.9)"; ctx.beginPath(); ctx.arc(w * 0.78, oy - SKY * s * 0.35, s * 1.6, 0, Math.PI * 2); ctx.fill();
  // bờ dừa nước
  palm(sx(5), oy, s * 5.5, 0.1); palm(sx(14), oy, s * 4.2, -0.15); palm(sx(86), oy, s * 5, -0.1); palm(sx(96), oy, s * 4.4, 0.15);
  // nước phù sa
  const g = ctx.createLinearGradient(0, oy, 0, sy(D));
  g.addColorStop(0, "#c9a46b"); g.addColorStop(0.18, "#8a9a78"); g.addColorStop(0.55, "#3f6f78"); g.addColorStop(1, "#0d2a36");
  ctx.fillStyle = g; ctx.fillRect(sx(0), oy, X * s, D * s);
  // sóng mặt nước
  ctx.strokeStyle = "rgba(255,246,222,.85)"; ctx.lineWidth = 2; ctx.beginPath();
  for (let x = 0; x <= X; x += 1) { const yy = oy + Math.sin(x * 0.9 + t * 2) * s * 0.08; x === 0 ? ctx.moveTo(sx(x), yy) : ctx.lineTo(sx(x), yy); }
  ctx.stroke();
  // vạch độ sâu
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,255,255,.07)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + " m", sx(0) + 4, sy(d) - 2, { size: 10, color: "rgba(255,255,255,.4)" });
  }
  // bến
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "#7a5634"; ctx.fillRect(sx(dp[0] - 2.2), sy(-0.7), 4.4 * s, 0.8 * s);
  ctx.fillStyle = "#5a3d22"; [-1.8, 1.8].forEach((o) => ctx.fillRect(sx(dp[0] + o) - 2, sy(0), 4, s * 1.8));
  ctx.strokeStyle = "rgba(255,230,150,.75)"; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  text("Bến", sx(dp[0]), sy(-1.4), { size: 12, align: "center", color: "#fff4d6", bold: true });
  // nút hái (bông trên mặt nước)
  const regrowTot = (meta.regrow_s || 20) * 60;
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false, cx = sx(n.pos[0]), cy = sy(n.pos[1]);
    ctx.fillStyle = ready ? "#3f8a4d" : "#4a5f4d"; ctx.beginPath(); ctx.ellipse(cx, cy, 1.1 * s, 0.32 * s, 0, 0, Math.PI * 2); ctx.fill();
    if (ready) { ctx.save(); ctx.translate(0, -0.3 * s + Math.sin(t * 2 + n.pos[0]) * 1.2); icon(n.kind, cx, cy, 0.55 * s); ctx.restore(); }
    else {
      ring(cx, cy - 0.9 * s, 0.45 * s, 1 - (n.regrow_ticks || 0) / regrowTot, "#9fd6a8", 3);
      text(Math.ceil((n.regrow_ticks || 0) / 60) + "s", cx, cy - 0.9 * s, { size: 10, align: "center", base: "middle" });
    }
  });
  // đàn cá
  (snap.fish || []).forEach((f) => {
    const cx = sx(f.pos[0]), cy = sy(f.pos[1]) + Math.sin(t * 1.5 + f.pos[0]) * s * 0.12;
    ctx.save(); ctx.translate(cx, cy);
    for (let i = -1; i <= 1; i++) { ctx.save(); ctx.translate(i * s * 0.9, -i * i * s * 0.35 + i * s * 0.25); icon(f.kind, 0, 0, 0.62 * s); ctx.restore(); }
    ctx.restore();
    text(kn(f.kind), cx, cy - 1 * s, { size: 10, align: "center", color: "rgba(255,255,255,.8)" });
  });
  // người chơi + bong bóng
  let target = null;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (underwater) {
      for (let i = 0; i < 4; i++) {
        const ph = (t * 0.7 + i * 0.25) % 1;
        ctx.fillStyle = `rgba(220,245,255,${0.55 * (1 - ph)})`; ctx.beginPath();
        ctx.arc(px + Math.sin(ph * 6 + i) * s * 0.3, py - ph * s * 2.4, s * (0.1 + 0.08 * i % 3), 0, Math.PI * 2); ctx.fill();
      }
      if (meta.catch_radius) { ctx.strokeStyle = "rgba(255,255,255,.22)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    } else if (meta.interact_radius) { ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    const a = ((p.heading_deg || 0) * Math.PI) / 180, face = Math.cos(a) >= 0 ? 1 : -1;
    ctx.fillStyle = "#c06a3a"; ctx.beginPath(); ctx.ellipse(px, py + 0.1 * s, 0.62 * s, 0.5 * s, 0, 0, Math.PI * 2); ctx.fill();       // áo bà ba
    ctx.fillStyle = "#f0b98a"; ctx.beginPath(); ctx.arc(px + face * 0.12 * s, py - 0.42 * s, 0.34 * s, 0, Math.PI * 2); ctx.fill();   // đầu
    ctx.fillStyle = "#b5282a"; ctx.fillRect(px + face * 0.12 * s - 0.34 * s, py - 0.7 * s, 0.68 * s, 0.16 * s);                    // khăn rằn
    ctx.strokeStyle = "#e9f7ff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(px + face * 0.3 * s, py - 0.42 * s, 0.13 * s, 0, Math.PI * 2); ctx.stroke(); // kính lặn
    // gợi ý thao tác (chỉ để hiển thị; luật do sim quyết định)
    if (dist(p.pos, dp) <= dr) msgPrompt = "E: cập bến, kết thúc buổi sáng";
    else if (!underwater) {
      const nd = (snap.nodes || []).filter((n) => n.ready !== false && dist(p.pos, n.pos) <= (meta.interact_radius || 2)).sort((m, n) => dist(p.pos, m.pos) - dist(p.pos, n.pos))[0];
      if (nd) { msgPrompt = `E: hái ${kn(nd.kind)}`; target = nd.pos; }
    } else {
      const fi = (snap.fish || []).filter((f) => dist(p.pos, f.pos) <= (meta.catch_radius || 2)).sort((m, n) => dist(p.pos, m.pos) - dist(p.pos, n.pos))[0];
      if (fi) { msgPrompt = p.catch_cd_ticks > 0 ? `Chờ bắt cá… ${(p.catch_cd_ticks / 60).toFixed(1)}s` : `Space: bắt ${kn(fi.kind)}`; target = fi.pos; }
    }
    if (target) { ctx.strokeStyle = "#ffe08a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sx(target[0]), sy(target[1]), 1.3 * s, 0, Math.PI * 2); ctx.stroke(); }
  }
  // HUD trên: giờ · oxy · máu
  panel(8, 8, Math.min(w - 16, 560), 56);
  text("⏱ " + fmtTime(snap.time_left_ticks), 22, 44, { size: 22, bold: true });
  if (p && p.oxygen_max_ticks) {
    const low = p.oxygen_ticks < p.oxygen_max_ticks * 0.25, blink = low && Math.floor(t * 4) % 2;
    bar(124, 16, 230, 22, p.oxygen_ticks / p.oxygen_max_ticks, blink ? "#ff8a80" : low ? "#ef5350" : "#4fc3f7", "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s");
    if (p.zero_oxy_ticks > 0) bar(124, 42, 230, 8, p.zero_oxy_ticks / (meta.choke_interval_ticks || 60), "#ff5252");
  }
  if (p && p.hp_max) {
    let hs = ""; for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥" : "♡";
    text(hs, 372, 44, { size: 26, color: "#ff6b81" });
  }
  if (p && p.pos) text(`x ${p.pos[0].toFixed(1)} · sâu ${p.pos[1].toFixed(1)} m`, w - 18, 30, { size: 12, align: "right", color: "#e7d9bf" });
  // giỏ
  if (snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity, bw = Math.min(w - 16, 60 + cap * 42), y0 = h - bottom + 8;
    panel(8, y0, bw, bottom - 16);
    const sz = Math.min(34, (bw - 24) / cap - 4);
    for (let i = 0; i < cap; i++) {
      const x0 = 18 + i * (sz + 4);
      rr(x0, y0 + 10, sz, sz, 6); ctx.fillStyle = "rgba(255,255,255,.1)"; ctx.fill();
      if (snap.hold[i]) icon(snap.hold[i], x0 + sz / 2 + 2, y0 + 10 + sz / 2, sz * 0.32);
    }
    const full = snap.hold.length >= cap;
    text(`Giỏ ${snap.hold.length}/${cap}${full ? " — ĐẦY" : ""}  ${itemList(counts(snap.hold))}`, 18, y0 + sz + 32, { size: 12, color: full ? BAD : "#e7d9bf" });
  }
  drawPrompt(msgPrompt, w, h - bottom - 14); msgPrompt = "";
  text("WASD/mũi tên bơi · E hái / cập bến · Space bắt cá · R chơi lại", w - 10, h - 12, { size: 12, align: "right", color: "#c9bba3" });
}
let msgPrompt = "";
function counts(arr) { const o = {}; arr.forEach((k) => (o[k] = (o[k] || 0) + 1)); return o; }

// ====================== QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) ======================
const ORDER_TEXT = { reserved: "chờ nấu", assigned: "đang làm món", served: "đang ăn", unfulfillable: "hết nguyên liệu" };
function drawQuan(w, h) {
  const meta = snap.meta || {}, menu = snap.menu || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 92, bottom = 52, t = now();
  const sideW = w >= 900 ? 250 : 0;
  const s = Math.max(1, Math.min((w - 24 - sideW) / X, (h - top - bottom) / Z));
  const ox = 12 + (w - 24 - sideW - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  // nước quanh nhà bè + sàn gỗ
  ctx.fillStyle = "#2a3a3d"; ctx.fillRect(0, top - 10, w - sideW, h - top - bottom + 20);
  ctx.fillStyle = "#b78a55"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = "rgba(60,36,16,.35)"; ctx.lineWidth = 1;
  for (let x = 0; x <= X; x += 1) { ctx.beginPath(); ctx.moveTo(sx(x), sy(Z)); ctx.lineTo(sx(x), sy(0)); ctx.stroke(); }
  ctx.strokeStyle = "#5a3a1f"; ctx.lineWidth = 5; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  // đèn dây vàng
  ctx.strokeStyle = "rgba(40,28,16,.8)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(0), sy(Z) - 6); ctx.quadraticCurveTo(sx(X / 2), sy(Z) + 18, sx(X), sy(Z) - 6); ctx.stroke();
  for (let i = 0; i <= 14; i++) {
    const u = i / 14, bx = sx(X * u), by = sy(Z) - 6 + 4 * 2 * u * (1 - u) * 4.5;
    ctx.fillStyle = `rgba(255,214,102,${0.7 + 0.3 * Math.sin(t * 3 + i)})`; ctx.beginPath(); ctx.arc(bx, by, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,214,102,.12)"; ctx.beginPath(); ctx.arc(bx, by, 14, 0, Math.PI * 2); ctx.fill();
  }
  const p = snap.player;
  const hand = snap.hand && typeof snap.hand === "object" ? snap.hand : null;
  const customers = snap.customers || [];
  const byTable = {}; customers.forEach((c) => (byTable[c.table_id] = c));
  // bếp
  (snap.stoves || []).forEach((st) => {
    const cx = sx(st.pos[0]), cy = sy(st.pos[1]), hs = 0.9 * s, did = dishOf(st.dish);
    ctx.fillStyle = "#3b3b40"; rr(cx - hs, cy - hs, hs * 2, hs * 2, 8); ctx.fill();
    if (st.state === "ready") { ctx.fillStyle = `rgba(143,227,160,${0.25 + 0.15 * Math.sin(t * 5)})`; ctx.beginPath(); ctx.arc(cx, cy, hs * 1.5, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = st.state === "cooking" ? "#e8892b" : st.state === "ready" ? "#6fbf5a" : "#6d6d72"; rr(cx - hs * 0.7, cy - hs * 0.7, hs * 1.4, hs * 1.4, 6); ctx.fill();
    if (st.state === "cooking") {
      for (let i = 0; i < 3; i++) { const ph = (t * 0.6 + i / 3) % 1; ctx.fillStyle = `rgba(230,230,230,${0.5 * (1 - ph)})`; ctx.beginPath(); ctx.arc(cx + Math.sin(ph * 5 + i) * s * 0.3, cy - hs - ph * s * 1.4, s * (0.18 + 0.25 * ph), 0, Math.PI * 2); ctx.fill(); }
      const tot = menu[did] ? menu[did].cook_s * 60 : 0;
      if (tot) ring(cx, cy, hs * 1.15, 1 - (st.cook_ticks_left || 0) / tot, "#ffd37a", 4);
      text(Math.ceil((st.cook_ticks_left || 0) / 60) + "s", cx, cy, { size: 13, align: "center", base: "middle", bold: true, color: "#2a1a0a" });
    }
    if (st.state === "ready") text("✔", cx, cy, { size: 20, align: "center", base: "middle", color: "#13350f" });
    text(st.id + (did ? " · " + dishName(did) : ""), cx, cy + hs + 14, { size: 11, align: "center", color: "#2a1a0a", bold: true });
  });
  // bàn + khách
  (snap.tables || []).forEach((tb) => {
    const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]);
    ctx.fillStyle = "#6e4524"; ctx.beginPath(); ctx.arc(cx, cy, 0.95 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#8a5a2e"; ctx.beginPath(); ctx.arc(cx, cy, 0.8 * s, 0, Math.PI * 2); ctx.fill();
    text(tb.id, cx, cy + 4, { size: 12, align: "center", color: "#fff" });
    const c = byTable[tb.id];
    if (!c) return;
    const gx = cx, gy = cy - 1.7 * s, eating = c.state === "eating" || c.order_status === "served";
    ctx.fillStyle = "#e2a577"; ctx.beginPath(); ctx.arc(gx, gy, 0.5 * s, 0, Math.PI * 2); ctx.fill();   // khách
    ctx.fillStyle = eating ? "#6aa86a" : "#4f6f9a"; ctx.beginPath(); ctx.arc(gx, gy + 0.55 * s, 0.45 * s, Math.PI, 0); ctx.fill();
    // bong bóng món gọi
    const label = dishName(c.dish_id);
    ctx.font = "bold 11px system-ui, sans-serif";
    const bw = ctx.measureText(label).width + 30, bx = gx - bw / 2, by = gy - 1.25 * s - 24;
    rr(bx, by, bw, 22, 11); ctx.fillStyle = "rgba(255,248,230,.95)"; ctx.fill();
    ctx.fillStyle = dishColor(c.dish_id); ctx.beginPath(); ctx.arc(bx + 12, by + 11, 6, 0, Math.PI * 2); ctx.fill();
    text(label, bx + 22, by + 11, { size: 11, bold: true, color: "#3a2a12", base: "middle" });
    if (eating) {
      const tot = (meta.eat_s || 10) * 60;
      bar(gx - 0.9 * s, gy + 1.15 * s, 1.8 * s, 8, 1 - (c.eat_ticks_left || 0) / tot, "#7bc67b");
    } else if (c.patience_ticks_left !== undefined) {
      const f = c.patience_ticks_left / ((meta.patience_s || 60) * 60);
      bar(gx - 0.9 * s, gy + 1.15 * s, 1.8 * s, 8, f, f > 0.5 ? "#7bc67b" : f > 0.25 ? "#f2c230" : "#ef5350");
    }
  });
  // người chơi + gợi ý
  let prompt = "";
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]), R = meta.interact_radius || 1.5;
    ctx.strokeStyle = "rgba(255,255,255,.45)"; ctx.setLineDash([4, 4]); ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(px, py, R * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "#c06a3a"; ctx.beginPath(); ctx.arc(px, py, 0.5 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#b5282a"; ctx.beginPath(); ctx.arc(px, py - 0.1 * s, 0.32 * s, Math.PI, 0); ctx.fill();   // khăn rằn
    if (hand) {
      ctx.fillStyle = dishColor(hand.dish_id); ctx.beginPath(); ctx.arc(px, py - 0.95 * s, 0.38 * s, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
      text(dishName(hand.dish_id), px, py - 1.5 * s, { size: 11, align: "center", bold: true, color: "#fff" });
    }
    const cands = [];
    (snap.stoves || []).forEach((st) => cands.push({ d: dist(p.pos, st.pos), k: 0, st }));
    (snap.tables || []).forEach((tb) => { if (byTable[tb.id]) cands.push({ d: dist(p.pos, tb.pos), k: 1, tb, c: byTable[tb.id] }); });
    const near = cands.filter((x) => x.d <= R).sort((a, c) => a.d - c.d || a.k - c.k)[0];
    if (near) {
      if (near.st) {
        const st = near.st;
        if (st.state === "idle") prompt = customers.some((c) => c.order_status === "reserved") ? "E: nấu món cho khách" : "Bếp đang trống";
        else if (st.state === "cooking") prompt = "Đang nấu…";
        else prompt = hand ? "Tay đang cầm món rồi" : "E: lấy món";
      } else {
        const c = near.c;
        if (c.order_status === "served" || c.state === "eating") prompt = "Khách đang ăn";
        else if (hand && hand.order_id === c.id) prompt = "E: phục vụ";
        else if (hand) prompt = "Sai món — món này của bàn khác";
        else prompt = "Chưa có món để bưng";
      }
    }
  }
  // HUD trên
  panel(8, 8, w - 16 - sideW, 64);
  text("⏱ " + fmtTime(snap.time_left_ticks), 22, 42, { size: 22, bold: true });
  text(`${snap.money ?? 0}k`, 130, 44, { size: 22, bold: true, color: "#ffe08a" });
  const rep = snap.reputation ?? 0;
  for (let i = 0; i < 5; i++) {
    const f = clamp01(rep - i), x0 = 230 + i * 26;
    text("★", x0, 44, { size: 24, color: "rgba(255,255,255,.2)" });
    if (f > 0) { ctx.save(); ctx.beginPath(); ctx.rect(x0, 18, 26 * f, 40); ctx.clip(); text("★", x0, 44, { size: 24, color: "#ffd24a" }); ctx.restore(); }
  }
  text(`${rep.toFixed(1)}`, 365, 44, { size: 16, color: "#e7d9bf" });
  text(`Điểm ${snap.score ?? 0}`, 420, 44, { size: 16, color: "#e7d9bf" });
  text("Kho: " + itemList(snap.stock), 22, 63, { size: 12, color: "#c9bba3" });
  // khung bên: đơn + thực đơn
  if (sideW) {
    const px0 = w - sideW + 4;
    panel(px0, 8, sideW - 12, h - 16 - 28);
    text("Đơn đang có", px0 + 14, 34, { size: 15, bold: true });
    let y = 52;
    if (!customers.length) text("Chưa có khách", px0 + 14, y + 8, { size: 12, color: "#c9bba3" });
    customers.forEach((c) => {
      text(`${c.table_id} · ${dishName(c.dish_id)}`, px0 + 14, y + 8, { size: 12, bold: true });
      text(ORDER_TEXT[c.order_status] || c.order_status || "", px0 + 14, y + 24, { size: 11, color: "#c9bba3" });
      if (c.patience_ticks_left !== undefined && c.state !== "eating") {
        const f = c.patience_ticks_left / ((meta.patience_s || 60) * 60);
        bar(px0 + 14, y + 30, sideW - 42, 7, f, f > 0.5 ? "#7bc67b" : f > 0.25 ? "#f2c230" : "#ef5350");
      }
      y += 52;
    });
    y = Math.max(y + 8, 170);
    text("Thực đơn", px0 + 14, y, { size: 15, bold: true });
    Object.keys(menu).sort().forEach((id) => {
      y += 24;
      const m = menu[id];
      const ok = Object.keys(m.recipe || {}).every((k) => ((snap.stock || {})[k] || 0) >= m.recipe[k]);
      ctx.fillStyle = dishColor(id); ctx.beginPath(); ctx.arc(px0 + 20, y - 4, 6, 0, Math.PI * 2); ctx.fill();
      text(`${dishName(id)} · ${m.price}k`, px0 + 32, y, { size: 12, bold: true, color: ok ? "#f3e9d8" : "#8d8070" });
      y += 15;
      text(`${itemList(m.recipe)} · ${m.cook_s}s`, px0 + 32, y, { size: 11, color: "#c9bba3" });
    });
  }
  drawPrompt(prompt, w - sideW, h - bottom - 6);
  text("WASD/mũi tên đi · E nấu / lấy món / phục vụ · R chơi lại", (w - sideW) - 10, h - 14, { size: 12, align: "right", color: "#c9bba3" });
}

function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  ctx.fillStyle = "#1b1410"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    if (snap.mode === "quan") drawQuan(w, h); else drawGather(w, h);
    drawToasts(w, h);
    overlay(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
</body>
